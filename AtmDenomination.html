<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let amount = prompt("Enter the amount to withdraw:");
        let denominations = [2000, 500, 200, 100, 50, 20, 10, 5, 2, 1];
        let result = {};
        for (let i = 0; i < denominations.length; i++) {
            let count = Math.floor(amount / denominations[i]);
            if (count > 0) {
                result[denominations[i]] = count;
                amount -= count * denominations[i];
            }
        }
        document.write("<h3>Denominations:</h3>");
        for (let denom in result) {
            document.write("<p>" + denom + " : " + result[denom] + "</p>");
        }
    </script>
</body>
</html>
