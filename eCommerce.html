<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: lightgreen;">
    <script>
        
        let price = Number(prompt("Enter the price of the product: "));
        let quantity = Number(prompt("Enter the quantity: "));
        let totalCost = price * quantity;
        let discountRate;
        if (totalCost > 2000) {
            discountRate = 10;
        } else if (totalCost > 500) {
            discountRate = 5;
        } else {
            discountRate = 0;
        }
        let discountAmount = (totalCost * discountRate) / 100;
        let finalAmount = totalCost - discountAmount;
        document.write("Total Cost: " + totalCost + "<br>");
        document.write("Discount Rate: " + discountRate + "%<br>");
        document.write("Discount Amount: " + discountAmount + "<br>");
        document.write("Final Amount to be paid: " + finalAmount + "<br>");
    </script>
    
</body>
</html>
